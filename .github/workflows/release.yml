name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config

      - name: Build release
        run: cargo build --release --workspace

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/handoffd dist/
          cp target/release/handoff dist/
          cp target/release/handoff-gui dist/ 2>/dev/null || true
          tar -czf handoff-linux-x86_64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: handoff-linux-x86_64.tar.gz

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer

      - name: Install xtool
        run: |
          curl -fsSL https://raw.githubusercontent.com/nicklockwood/XcodeBuild/main/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build IPA
        working-directory: ios
        run: |
          ~/.local/bin/xtool dev build --ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/*.ipa

  build-relay:
    name: Build Relay Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build relay
        working-directory: relay
        run: |
          go build -o handoff-relay
          tar -czf handoff-relay-linux-x86_64.tar.gz handoff-relay

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-binary
          path: relay/handoff-relay-linux-x86_64.tar.gz

  release:
    name: Create Release
    needs: [build-linux, build-ios, build-relay]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-binaries/handoff-linux-x86_64.tar.gz
            artifacts/ios-ipa/*.ipa
            artifacts/relay-binary/handoff-relay-linux-x86_64.tar.gz
            install.sh
          generate_release_notes: true
          draft: false
          prerelease: false

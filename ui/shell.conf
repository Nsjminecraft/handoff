// Quickshell config for handoff-ui
// Requires: quickshell (https://github.com/quickshell/quickshell)

import QtQuick
import Quickshell

ShellRoot {
    id: root

    property var daemonClient: DaemonClient {}

    // Status indicator in top bar
    StatusWidget {
        id: statusWidget
        anchors.top: parent.top
        anchors.right: parent.right
        anchors.margins: 8
        connectedDevices: daemonClient.connectedPeers
    }

    // Notification overlay
    NotificationPopup {
        id: notificationPopup
        anchors.top: parent.top
        anchors.horizontalCenter: parent.horizontalCenter
        width: 400
        visible: false
    }

    // Clipboard history widget
    ClipboardHistory {
        id: clipboardHistory
        anchors.right: parent.right
        anchors.verticalCenter: parent.verticalCenter
        visible: false
    }

    // Device panel (toggleable)
    DevicePanel {
        id: devicePanel
        anchors.fill: parent
        visible: false
        devices: daemonClient.devices
    }

    // Keybinds
    ShortcutHandler {
        shortcut: "Meta+Shift+C"
        onTriggered: clipboardHistory.visible = !clipboardHistory.visible
    }

    ShortcutHandler {
        shortcut: "Meta+Shift+D"
        onTriggered: devicePanel.visible = !devicePanel.visible
    }

    Component.onCompleted: {
        daemonClient.connect()
    }
}
